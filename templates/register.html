<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Spa Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Poppins',sans-serif;
            min-height:100vh;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
                url("https://images.unsplash.com/photo-1544161515-4ab6ce6db874?w=1400") center/cover;
            display:flex; align-items:center; justify-content:center;
        }
        .auth-box {
            background:white; border-radius:20px;
            padding:40px; width:100%; max-width:440px;
            box-shadow:0 20px 60px rgba(0,0,0,0.3);
        }
        .auth-box h2 { font-size:24px; color:#2c3e50; margin-bottom:6px; }
        .auth-box p  { font-size:13px; color:gray; margin-bottom:25px; }
        .form-group { display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
        .form-group label { font-size:11px; font-weight:600; color:#888; text-transform:uppercase; letter-spacing:0.05em; }
        .form-group input {
            padding:12px 15px; border:1.5px solid #e8e8e8;
            border-radius:10px; font-family:'Poppins',sans-serif;
            font-size:14px; outline:none; transition:border-color 0.2s;
        }
        .form-group input:focus { border-color:#2ecc71; }
        .form-row { display:flex; gap:12px; }
        .form-row .form-group { flex:1; }
        .error { background:#ffeaea; color:#e74c3c; padding:10px 15px; border-radius:8px; font-size:13px; margin-bottom:16px; }
        .submit-btn {
            width:100%; padding:14px; background:#2ecc71; color:white;
            border:none; border-radius:10px; font-family:'Poppins',sans-serif;
            font-size:15px; font-weight:600; cursor:pointer; transition:background 0.2s;
        }
        .submit-btn:hover { background:#27ae60; }
        .auth-link { text-align:center; margin-top:20px; font-size:13px; color:gray; }
        .auth-link a { color:#2ecc71; text-decoration:none; font-weight:600; }
        .logo { font-size:22px; font-weight:700; color:#2ecc71; margin-bottom:20px; display:block; }
    </style>
</head>
<body>
    <div class="auth-box">
        <span class="logo">✦ Spa Center</span>
        <h2>Create an Account</h2>
        <p>Register to manage your bookings easily</p>

        {% if error %}
        <div class="error"><i class="fa-solid fa-circle-exclamation"></i> {{ error }}</div>
        {% endif %}

        <form method="POST" action="/register/">
            {% csrf_token %}
            <div class="form-row">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" name="first_name" placeholder="Sara" required>
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" name="last_name" placeholder="El Amrani" required>
                </div>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" name="password2" placeholder="••••••••" required>
            </div>
            <button type="submit" class="submit-btn">Create Account</button>
        </form>
        <div class="auth-link">Already have an account? <a href="/login/">Log in</a></div>
    </div>
</body>
</html>
