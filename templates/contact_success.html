<!DOCTYPE html>
<html>
<head>
    <title>Message Sent</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; background: #f5f7f6; }
        .box { text-align: center; background: white; padding: 50px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .box i { font-size: 60px; color: #2ecc71; }
        h2 { margin: 20px 0 10px; color: #2c3e50; }
        p  { color: gray; margin-bottom: 25px; }
        a  { padding: 12px 30px; background: #2ecc71; color: white; border-radius: 8px; text-decoration: none; font-weight: 500; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="box">
        <i class="fa-solid fa-paper-plane"></i>
        <h2>Message Sent!</h2>
        <p>Thank you for reaching out. We'll get back to you as soon as possible.</p>
        <a href="/">Back to Home</a>
    </div>
</body>
</html>
