<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Spa Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Poppins',sans-serif; min-height:100vh;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
                url("https://images.unsplash.com/photo-1544161515-4ab6ce6db874?w=1400") center/cover;
            display:flex; align-items:center; justify-content:center;
        }
        .auth-box {
            background:white; border-radius:20px; padding:40px;
            width:100%; max-width:400px;
            box-shadow:0 20px 60px rgba(0,0,0,0.3);
        }
        .auth-box h2 { font-size:24px; color:#2c3e50; margin-bottom:6px; }
        .auth-box p  { font-size:13px; color:gray; margin-bottom:25px; }
        .form-group { display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
        .form-group label { font-size:11px; font-weight:600; color:#888; text-transform:uppercase; letter-spacing:0.05em; }
        .form-group input {
            padding:12px 15px; border:1.5px solid #e8e8e8;
            border-radius:10px; font-family:'Poppins',sans-serif;
            font-size:14px; outline:none; transition:border-color 0.2s;
        }
        .form-group input:focus { border-color:#2ecc71; }
        .error { background:#ffeaea; color:#e74c3c; padding:10px 15px; border-radius:8px; font-size:13px; margin-bottom:16px; }
        .submit-btn {
            width:100%; padding:14px; background:#2ecc71; color:white;
            border:none; border-radius:10px; font-family:'Poppins',sans-serif;
            font-size:15px; font-weight:600; cursor:pointer; transition:background 0.2s;
        }
        .submit-btn:hover { background:#27ae60; }
        .auth-link { text-align:center; margin-top:20px; font-size:13px; color:gray; }
        .auth-link a { color:#2ecc71; text-decoration:none; font-weight:600; }
        .logo { font-size:22px; font-weight:700; color:#2ecc71; margin-bottom:20px; display:block; }
        .hamburger { display:none; flex-direction:column; cursor:pointer; gap:5px; background:none; border:none; padding:5px; }
.hamburger span { width:25px; height:2px; background:#333; border-radius:2px; }
.nav-menu { display:flex; align-items:center; }
@media (max-width: 768px) {
    .hamburger { display:flex; }
    .nav-menu { display:none; flex-direction:column; width:100%; background:white; padding:15px 0; border-top:1px solid #eee; }
    .nav-menu.open { display:flex; }
    .nav-menu a { margin-left:0 !important; padding:10px 20px; font-size:14px !important; width:100%; }
    .navbar { flex-wrap:wrap; padding:15px 20px; }
    .page-hero { height:180px; }
    .page-hero h2 { font-size:24px; }
    .booking-section, .contact-section { flex-direction:column; padding:25px 15px; }
    .booking-info, .contact-left { width:100%; max-width:100%; }
    .booking-form-wrap, .contact-form-wrap { width:100%; padding:20px 15px; }
    .form-row { flex-direction:column; }
    .dashboard { padding:0 15px; }
    .welcome { flex-direction:column; text-align:center; }
    .booking-card { flex-direction:column; }
    .footer-main { padding:30px 15px 0; }
    .footer-grid { grid-template-columns:1fr; }
    .auth-box { padding:25px 15px; margin:15px; }
}
    </style>
</head>
<body>
    <div class="auth-box">
        <span class="logo">✦ Spa Center</span>
        <h2>Welcome Back</h2>
        <p>Log in to see your booking history</p>

        {% if error %}
        <div class="error"><i class="fa-solid fa-circle-exclamation"></i> {{ error }}</div>
        {% endif %}

        <form method="POST" action="/login/">
            {% csrf_token %}
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="submit-btn">Log In</button>
        </form>
        <div class="auth-link">Don't have an account? <a href="/register/">Register</a></div>
        <div class="auth-link" style="margin-top:10px;"><a href="/">← Back to Home</a></div>
    </div>
    <script>
    const h = document.getElementById('hamburger');
    const n = document.getElementById('nav-menu');
    if(h) { h.addEventListener('click', () => { n.classList.toggle('open'); }); }
</script>
</body>
</html>
